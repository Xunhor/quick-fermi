<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1350px;
            background: #0B0F14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .glow {
            position: absolute;
            width: 1200px;
            height: 1200px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.25) 0%, rgba(16, 185, 129, 0.15) 40%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
        .mockup-container {
            position: relative;
            z-index: 1;
            width: 900px;
            transform: perspective(1200px) rotateX(8deg) rotateY(-12deg) rotateZ(2deg);
            box-shadow: 
                -30px 40px 80px rgba(0,0,0, 0.8),
                0 0 0 2px rgba(255,255,255, 0.05),
                inset 0 1px 1px rgba(255,255,255, 0.2);
            border-radius: 12px;
            background: #1C1C1E;
        }
        .mac-header {
            height: 38px;
            background: #2D2D2F;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid rgba(0,0,0,0.5);
        }
        .traffic-lights {
            display: flex;
            gap: 8px;
        }
        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .red { background: #FF5F56; }
        .yellow { background: #FFBD2E; }
        .green { background: #27C93F; }
        .url-bar {
            margin: 0 auto;
            background: #1C1C1E;
            padding: 4px 60px;
            border-radius: 6px;
            color: #8E8E93;
            font-size: 13px;
            letter-spacing: 0.5px;
            transform: translateX(-24px); /* offset traffic lights */
        }
        .screen {
            width: 100%;
            height: 562px; /* 16:10 aspect */
            overflow: hidden;
            border-radius: 0 0 12px 12px;
            background: #000;
        }
        .screen img {
            width: 100%;
            height: auto;
            display: block;
        }
        .badge {
            position: absolute;
            bottom: 60px;
            right: 60px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 99px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge-dot {
            width: 10px;
            height: 10px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="mockup-container">
        <div class="mac-header">
            <div class="traffic-lights">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
            <div class="url-bar">
                <svg width="10" height="12" viewBox="0 0 10 12" fill="none" style="margin-right: 6px; vertical-align: middle;">
                    <path d="M8 4V3C8 1.34315 6.65685 0 5 0C3.34315 0 2 1.34315 2 3V4H1C0.447715 4 0 4.44772 0 5V11C0 11.5523 0.447715 12 1 12H9C9.55228 12 10 11.5523 10 11V5C10 4.44772 9.55228 4 9 4H8ZM3 4V3C3 1.89543 3.89543 1 5 1C6.10457 1 7 1.89543 7 3V4H3Z" fill="#8E8E93"/>
                </svg>
                boomo.com.br
            </div>
        </div>
        <div class="screen">
            <!-- Ensure local file path uses file:/// protocol -->
            <img src="file:///C:/Users/junio/Desktop/Boomo_Site_Real.png" alt="Boomo Site">
        </div>
    </div>
    <div class="badge">
        <div class="badge-dot"></div>
        100% Uptime
    </div>
</body>
</html>
